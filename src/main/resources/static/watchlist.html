<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MoodFlix - My Watchlist</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #141414;
            color: white;
        }

        header {
            background: #000;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #e50914;
            font-size: 28px;
            font-weight: bold;
        }

        .back-btn {
            background: #e50914;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        h1 {
            text-align: center;
            margin: 30px 0;
        }

        #watchlistContainer {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            padding: 20px 40px;
        }

        .movie-card {
            background: #222;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .movie-card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
        }

        .movie-info {
            padding: 15px;
        }

        .movie-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .rating {
            color: #ffd700;
            margin-bottom: 15px;
        }

        .remove-btn {
            width: 100%;
            padding: 10px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .remove-btn:hover {
            background: #b20710;
        }

        .empty {
            text-align: center;
            font-size: 20px;
            margin-top: 60px;
            color: #aaa;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">🎬 MoodFlix</div>

    <button class="back-btn" onclick="goBack()">
        ← Back to Movies
    </button>
</header>

<h1>❤️ My Watchlist</h1>

<div id="watchlistContainer">
    Loading...
</div>

<script>

    const userId = 6;

    async function loadWatchlist() {

        try {

            const response = await fetch(`/api/watchlist/${userId}`);

            if (!response.ok) {
                throw new Error("Failed to load watchlist");
            }

            const movies = await response.json();

            const container = document.getElementById("watchlistContainer");

            if (movies.length === 0) {

                container.innerHTML =
                    `<div class="empty">
                        ❤️ Your Watchlist is empty.
                    </div>`;

                return;
            }

            container.innerHTML = "";

            movies.forEach(movie => {

                const poster = movie.posterPath
                    ? `https://image.tmdb.org/t/p/w500${movie.posterPath}`
                    : "https://via.placeholder.com/500x750?text=No+Poster";

                container.innerHTML += `

                    <div class="movie-card">

                        <img src="${poster}" alt="${movie.movieTitle}">

                        <div class="movie-info">

                            <div class="movie-title">
                                ${movie.movieTitle}
                            </div>

                            <div class="rating">
                                ⭐ ${movie.rating}
                            </div>

                            <button
                                class="remove-btn"
                                onclick="removeMovie(${movie.movieId})">

                                ❌ Remove from Watchlist

                            </button>

                        </div>

                    </div>

                `;
            });

        } catch (error) {

            console.error(error);

            document.getElementById("watchlistContainer").innerHTML =
                `<div class="empty">
                    ❌ Unable to load Watchlist.
                </div>`;
        }
    }


    async function removeMovie(movieId) {

        try {

            const response = await fetch(
                `/api/watchlist/${userId}/${movieId}`,
                {
                    method: "DELETE"
                }
            );

            if (!response.ok) {
                throw new Error("Failed to remove movie");
            }

            alert("❌ Movie removed from Watchlist!");

            loadWatchlist();

        } catch (error) {

            console.error(error);

            alert("❌ Unable to remove movie.");
        }
    }


    function goBack() {
        window.location.href = "index.html";
    }


    loadWatchlist();

</script>

</body>
</html>
