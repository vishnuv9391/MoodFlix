
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="google-site-verification" content="P0mui8CTztvdLHmFaZREp6RlZFuZchaYeMkmfI9qWaE" />

    <title>MoodFlix - Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #141414;
            color: white;
        }

        .container {
            width: 350px;
            margin: 100px auto;
            background: #222;
            padding: 35px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            color: #e50914;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            box-sizing: border-box;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 6px;
            background: #e50914;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #b20710;
        }

        #message {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎬 MoodFlix</h1>
        <h2>Login</h2>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
        >

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
        >

        <button onclick="loginUser()">Login</button>

        <div id="message"></div>
    </div>

    <script>
        function loginUser() {
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let message = document.getElementById("message");

            if (email === "" || password === "") {
                message.innerHTML =
                    "⚠️ Please enter email and password.";
                return;
            }

            fetch("/api/users/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            })
            .then(response => {
                return response.text().then(data => {
                    if (!response.ok) {
                        throw new Error(data);
                    }
                    return data;
                });
            })
            .then(data => {
                message.innerHTML = "✅ Login successful!";

                setTimeout(() => {
                    window.location.href = "/index.html";
                }, 1000);
            })
            .catch(error => {
                message.innerHTML = "❌ " + error.message;
            });
        }
    </script>
</body>
</html>
